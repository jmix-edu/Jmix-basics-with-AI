# Booking application + PostgreSQL on one machine (specs/04_deployment/01-deployment.spec.adoc).
# Build the JAR first: ./gradlew -Pvaadin.productionMode=true bootJar
# Secrets come from .env next to this file (see .env.example), never from the repository.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: ${DB_USERNAME:-booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MAIN_DATASOURCE_URL: jdbc:postgresql://db:5432/booking
      MAIN_DATASOURCE_USERNAME: ${DB_USERNAME:-booking}
      MAIN_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      FILE_STORAGE_DIR: /app/filestorage
      # The AI chat is off in prod (spring.ai.model.chat=none); the key is passed for when it is turned on
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - file-storage:/app/filestorage

volumes:
  db-data:
  file-storage:
