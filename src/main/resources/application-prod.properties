# Deployment: everything environment-specific comes from environment variables.
# No defaults on purpose: a missing variable stops the startup instead of connecting to the wrong place.

main.datasource.url=${MAIN_DATASOURCE_URL}
main.datasource.username=${MAIN_DATASOURCE_USERNAME}
main.datasource.password=${MAIN_DATASOURCE_PASSWORD}

jmix.localfs.storage-dir=${FILE_STORAGE_DIR}

# AI chat is off in prod until employees cannot read others' bookings through it
# (specs/05_addons/01-ai-tools.spec.adoc, backlog)
spring.ai.model.chat=none

ui.login.defaultUsername=
ui.login.defaultPassword=

# Quiet logs
spring.output.ansi.enabled=never
logging.level.eclipselink.logging.sql=warn
logging.level.io.jmix=warn
logging.level.io.jmix.core.AccessLogger=warn
logging.level.org.springframework.security=warn
logging.level.liquibase=warn
logging.level.com.company.booking=info
