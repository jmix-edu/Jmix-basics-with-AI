spring.application.name=booking

# Without an explicit profile the app runs as dev (HSQLDB, demo data). Containers set SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

main.liquibase.change-log=com/company/booking/liquibase/changelog.xml

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=com/company/booking/menu.xml
jmix.ui.composite-menu=true

jmix.core.available-locales=ru_RU,en

# Uploaded files (floor plans); the storage directory is set per profile
jmix.localfs.max-file-size=10MB

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

logging.level.org.atmosphere=warn

# AI Tools chat model: z-ai/glm-5.2 via OpenRouter (OpenAI-compatible API).
# The key comes only from the environment; without it the app starts and the chat reports an error.
spring.ai.model.chat=openai
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.chat.options.model=z-ai/glm-5.2
